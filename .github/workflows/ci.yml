name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:audit
      - run: pnpm test:import
      - run: pnpm test:export
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
